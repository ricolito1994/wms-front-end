name: Deploy Frontend

on:
  push:
    branches:
      - stable   # adjust to your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout frontend code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Prepare env file (optional)
      - name: Prepare env file
        working-directory: ./wms-front-end
        run: |
          if [ -f .env.production ]; then
            cp .env.production .env
          fi

      # 4. Install dependencies
      - name: Install dependencies
        working-directory: ./wms-front-end
        run: npm ci

      # 5. Build Vite project
      - name: Build project
        working-directory: ./wms-front-end
        run: npm run build

      # 6. List build output (debug)
      - name: List build output
        working-directory: ./wms-front-end
        run: ls -la dist

      # 7. Deploy build to EC2 (Nginx container volume)
      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./wms-front-end/dist/*"
          target: "/var/www/wms-front-end"
          strip_components: 1
      # 8. Reload Nginx in Docker
      - name: Reload Nginx
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail
            # restart Nginx container to refresh frontend
            sudo docker restart nginx