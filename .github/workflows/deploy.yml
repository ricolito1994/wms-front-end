name: Deploy Frontend

on:
  push:
    branches:
      - stable  # adjust if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout frontend code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Vite project
      - name: Build project
        run: npm run build

      # 5. List build output (debug)
      - name: List build output
        run: ls -la dist

      # 6. Deploy build to EC2 Nginx container
      - name: Deploy frontend to EC2 Docker
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail

            FRONTEND_LOCAL_DIST="/home/runner/work/wms-front-end/dist"
            FRONTEND_REMOTE_DIR="/var/www/frontend"  # this matches your Docker volume mount

            # Create remote folder if missing
            sudo mkdir -p "$FRONTEND_REMOTE_DIR"

            # Sync dist/ into Docker volume
            sudo rsync -av --delete "$FRONTEND_LOCAL_DIST/" "$FRONTEND_REMOTE_DIR/"

            # Restart nginx container to pick up new files
            sudo docker restart nginx

            echo "✅ Frontend deployed successfully!"
