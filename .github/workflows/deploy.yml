name: 🚀 Deploy Frontend + Backend

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js for frontend
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Build frontend (Vite)
      - name: Build frontend
        working-directory: ./wms-front-end
        run: |
          # Use production env if exists
          if [ -f .env.production ]; then
            cp .env.production .env
          fi
          npm ci
          npm run build

      - name: List frontend build output
        working-directory: ./wms-front-end
        run: ls -la dist

      # 4. Deploy frontend to Docker Nginx
      - name: Deploy frontend to Docker Nginx
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail

            # Copy build to temporary folder on host
            rm -rf /tmp/frontend_build
            mkdir -p /tmp/frontend_build
            scp -r ./wms-front-end/dist/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/frontend_build

            # Copy into Nginx container
            sudo docker cp /tmp/frontend_build/. nginx:/var/www/frontend/

            # Restart Nginx container to refresh files
            sudo docker restart nginx

