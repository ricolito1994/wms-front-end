name: Deploy Frontend

on:
  push:
    branches:
      - stable

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies and build Vite project
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # 4. Deploy to EC2 Docker Nginx
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail

            LOCAL_DIST="${{ github.workspace }}/dist"
            REMOTE_DIR="/var/www/frontend"

            # Ensure volume folder exists
            sudo mkdir -p "$REMOTE_DIR"

            # Copy build into Docker volume
            sudo rsync -av --delete "$LOCAL_DIST/" "$REMOTE_DIR/"

            # Restart Nginx container
            sudo docker restart nginx

            echo "✅ Frontend deployed inside Docker Nginx!"
