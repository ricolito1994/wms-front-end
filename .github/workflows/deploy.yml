name: Deploy Frontend

on:
  push:
    branches:
      - stable

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd wms-front-end
          npm ci

      - name: Build Vite project
        run: |
          cd wms-front-end
          npm run build

      - name: Deploy frontend to EC2 Docker Nginx
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail

            FRONTEND_LOCAL_DIST="${{ github.workspace }}/wms-front-end/dist"
            FRONTEND_REMOTE_DIR="/var/www/frontend"

            sudo mkdir -p "$FRONTEND_REMOTE_DIR"
            sudo rsync -av --delete "$FRONTEND_LOCAL_DIST/" "$FRONTEND_REMOTE_DIR/"

            # Restart nginx container so it picks up the new frontend
            sudo docker restart nginx

            echo "✅ Frontend deployed inside Docker Nginx!"
