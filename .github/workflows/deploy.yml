name: Deploy Frontend to Nginx Container

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout frontend code
      - name: Checkout frontend
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. Install dependencies and build
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # 4. Save SSH key to a temporary file
      - name: Save SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      # 5. Upload build to EC2 via rsync
      - name: Upload frontend build
        run: |
          rsync -avz -e "ssh -i key.pem -o StrictHostKeyChecking=no -p 22" dist/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/wms-front-end/dist/

      # 6. Copy build into Nginx container and reload
      - name: Deploy to Nginx container
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            CONTAINER_ID=$(docker ps -qf "name=nginx")
            docker exec $CONTAINER_ID rm -rf /var/www/frontend/*
            docker cp /var/www/wms-front-end/dist/. $CONTAINER_ID:/var/www/frontend/
            docker exec $CONTAINER_ID nginx -s reload
