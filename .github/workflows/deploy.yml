name: Deploy Frontend

on:
  push:
    branches:
      - stable   # or master, adjust to your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18  # adjust to your project

      # 3. Create .env from .env.production
      - name: Prepare env file
        run: |
          if [ -f .env.production ]; then
            cp .env.production .env
          fi

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Build frontend
      - name: Build project
        run: npm run build
      
      - name: List build output
        run: ls -R
        
      # 6. Deploy build to EC2
      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"     # React/Vue
          target: "/var/www/wms-front-end"
          strip_components: 1
