name: Deploy Frontend to Nginx Container

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout frontend code
      - name: Checkout frontend
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. Install dependencies and build
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Upload via rsync
        run: |
          rsync -avz -e "ssh -i ${{ secrets.EC2_SSH_KEY }} -p 22" dist/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/wms-front-end/dist/

      # 4. Deploy to EC2 via SSH
      - name: Copy build and reload Nginx
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            CONTAINER_ID=$(docker ps -qf "name=nginx")
            docker exec $CONTAINER_ID rm -rf /var/www/frontend/*
            docker cp /var/www/wms-front-end/dist/. $CONTAINER_ID:/var/www/frontend/
            docker exec $CONTAINER_ID nginx -s reload
